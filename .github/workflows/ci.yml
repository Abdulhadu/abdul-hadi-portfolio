name: CI + Deploy to Vercel

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  # ─────────────────────────────────────────────────────────────────────────
  # JOB 1: Quality gates — must pass before deploy
  # ─────────────────────────────────────────────────────────────────────────
  quality:
    name: Type-check · Lint · Build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: TypeScript type-check
        run: npm run type-check

      - name: Lint
        run: npm run lint

      - name: Build (verify production build compiles)
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          RESEND_FROM_EMAIL: ${{ secrets.RESEND_FROM_EMAIL }}
          RESEND_TO_EMAIL: ${{ secrets.RESEND_TO_EMAIL }}
        run: npm run build

      - name: Upload .next build artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: nextjs-build
          path: .next/
          retention-days: 3

  # ─────────────────────────────────────────────────────────────────────────
  # JOB 2: Deploy to Vercel — only on main branch pushes, after CI passes
  # ─────────────────────────────────────────────────────────────────────────
  deploy:
    name: Deploy to Vercel
    runs-on: ubuntu-latest
    needs: quality
    # Only deploy on push to main (not PRs, not develop)
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Pull Vercel project settings
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy to Vercel (production)
        id: deploy
        run: |
          # Capture full output, extract the https:// URL line
          OUTPUT=$(vercel deploy --prod --token=${{ secrets.VERCEL_TOKEN }} 2>&1)
          echo "--- Vercel output ---"
          echo "$OUTPUT"
          echo "---------------------"
          # Extract the deployment URL (line starting with https://)
          DEPLOY_URL=$(echo "$OUTPUT" | grep -E '^https://' | tail -1)
          if [ -z "$DEPLOY_URL" ]; then
            echo "❌ Could not extract deployment URL from output"
            exit 1
          fi
          echo "url=$DEPLOY_URL" >> $GITHUB_OUTPUT
          echo "🚀 Deployed to: $DEPLOY_URL"

      - name: Verify deployment is live (with retry)
        run: |
          URL="${{ steps.deploy.outputs.url }}"
          echo "Checking live status of: $URL"
          # Retry up to 5 times with 15s delay — Vercel may need a moment
          for i in 1 2 3 4 5; do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" -L --max-redirs 5 "$URL")
            echo "Attempt $i: HTTP $STATUS"
            if [ "$STATUS" = "200" ] || [ "$STATUS" = "308" ]; then
              echo "✅ Site is live at $URL (HTTP $STATUS)"
              exit 0
            fi
            sleep 15
          done
          echo "⚠️ Site did not return 200 after 5 attempts — may still be propagating"
          echo "URL: $URL"
          # Don't fail — the deploy succeeded, propagation just takes time
          exit 0

      - name: Post deployment URL to summary
        if: always()
        run: |
          echo "## 🚀 Deployment Complete" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Live URL:** ${{ steps.deploy.outputs.url }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Commit:** \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "_Check your Vercel dashboard for full deployment details_" >> $GITHUB_STEP_SUMMARY
