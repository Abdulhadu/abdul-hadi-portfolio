name: CI + Deploy to Vercel

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  # ─────────────────────────────────────────────────────────────────────────
  # JOB 1: Quality gates — must pass before deploy
  # ─────────────────────────────────────────────────────────────────────────
  quality:
    name: Type-check · Lint · Build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: TypeScript type-check
        run: npm run type-check

      - name: Lint
        run: npm run lint

      - name: Build (verify production build compiles)
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          RESEND_FROM_EMAIL: ${{ secrets.RESEND_FROM_EMAIL }}
          RESEND_TO_EMAIL: ${{ secrets.RESEND_TO_EMAIL }}
        run: npm run build

      - name: Upload .next build artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: nextjs-build
          path: .next/
          retention-days: 3

  # ─────────────────────────────────────────────────────────────────────────
  # JOB 2: Deploy to Vercel — only on main branch pushes, after CI passes
  # ─────────────────────────────────────────────────────────────────────────
  deploy:
    name: Deploy to Vercel
    runs-on: ubuntu-latest
    needs: quality
    # Only deploy on push to main (not PRs, not develop)
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Pull Vercel project settings
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy to Vercel (production)
        id: deploy
        run: |
          # Run deploy and capture ALL output
          OUTPUT=$(vercel deploy --prod --token=${{ secrets.VERCEL_TOKEN }} 2>&1) || true
          echo "--- Full Vercel output ---"
          echo "$OUTPUT"
          echo "--------------------------"
          # Extract https:// URL — try multiple patterns
          DEPLOY_URL=$(echo "$OUTPUT" | grep -oE 'https://[a-zA-Z0-9._-]+\.vercel\.app' | tail -1)
          if [ -z "$DEPLOY_URL" ]; then
            # Try any https:// URL as fallback
            DEPLOY_URL=$(echo "$OUTPUT" | grep -E '^https://' | tail -1)
          fi
          if [ -z "$DEPLOY_URL" ]; then
            echo "⚠️ Could not extract URL — deployment may still have succeeded"
            DEPLOY_URL="unknown"
          fi
          echo "url=$DEPLOY_URL" >> $GITHUB_OUTPUT
          echo "🚀 Deployed to: $DEPLOY_URL"

      - name: Check deployment status
        continue-on-error: true
        run: |
          URL="${{ steps.deploy.outputs.url }}"
          if [ "$URL" = "unknown" ] || [ -z "$URL" ]; then
            echo "⚠️ No URL to check — see Vercel dashboard for status"
            exit 0
          fi
          echo "Pinging $URL (with retries)..."
          for i in 1 2 3 4 5; do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" -L --max-redirs 5 --connect-timeout 10 "$URL" 2>/dev/null || echo "000")
            echo "Attempt $i: HTTP $STATUS"
            if [ "$STATUS" = "200" ] || [ "$STATUS" = "308" ] || [ "$STATUS" = "301" ] || [ "$STATUS" = "302" ]; then
              echo "✅ Site is live!"
              exit 0
            fi
            sleep 15
          done
          echo "ℹ️ Site may still be propagating — check Vercel dashboard"
          exit 0

      - name: Post deployment summary
        if: always()
        run: |
          URL="${{ steps.deploy.outputs.url }}"
          echo "## 🚀 Deployed to Vercel" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ -n "$URL" ] && [ "$URL" != "unknown" ]; then
            echo "**Live URL:** [$URL]($URL)" >> $GITHUB_STEP_SUMMARY
          else
            echo "**Status:** Check [Vercel Dashboard](https://vercel.com/abdulhadus-projects/abdul-hadi-portfolio)" >> $GITHUB_STEP_SUMMARY
          fi
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Commit:** \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
